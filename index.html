
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020805">
<meta name="description" content="Karan Raj | Cybersecurity, Ethical Hacking & Generative AI Portfolio">

<title>Karan Raj | Cybersecurity Developer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Share+Tech+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =========================================
   MATRIX CYBERSECURITY PORTFOLIO
   ========================================= */

:root {
    --bg: #020805;
    --bg2: #07110b;
    --card: rgba(7, 20, 12, 0.88);
    --green: #00ff66;
    --green2: #00cc55;
    --light: #b8ffd0;
    --text: #e5ffe9;
    --muted: #789b82;
    --border: rgba(0,255,102,0.22);
    --glow: 0 0 18px rgba(0,255,102,0.22);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    scroll-padding-top: 90px;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
    line-height: 1.7;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    opacity: 0.035;
    background: repeating-linear-gradient(
        transparent 0px,
        transparent 2px,
        #00ff66 3px
    );
}

a {
    color: inherit;
    text-decoration: none;
}

button, input, textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

::selection {
    background: var(--green);
    color: black;
}

.container {
    width: min(1150px, 91%);
    margin: auto;
}

section {
    padding: 100px 0;
    position: relative;
}

.section-tag {
    font-family: 'Share Tech Mono', monospace;
    color: var(--green);
    letter-spacing: 3px;
    font-size: 13px;
    margin-bottom: 12px;
}

.section-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(27px, 4.5vw, 45px);
    line-height: 1.3;
    margin-bottom: 18px;
}

.section-title span {
    color: var(--green);
    text-shadow: 0 0 15px #00ff6650;
}

.section-desc {
    color: var(--muted);
    max-width: 650px;
    margin-bottom: 45px;
}

.grid-bg {
    background-image:
        linear-gradient(rgba(0,255,102,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,102,.035) 1px, transparent 1px);
    background-size: 45px 45px;
}

.green-line {
    height: 1px;
    width: 100%;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    opacity: .35;
}

/* NAVBAR */

header {
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 1000;
    background: rgba(2,8,5,.9);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
}

.navbar {
    min-height: 75px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    font-size: 24px;
    color: var(--green);
    text-shadow: 0 0 12px #00ff6650;
}

.logo small {
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
}

.nav-links {
    display: flex;
    gap: 27px;
    list-style: none;
}

.nav-links a {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    transition: .3s;
}

.nav-links a:hover {
    color: var(--green);
    text-shadow: 0 0 10px var(--green);
}

.menu-toggle {
    display: none;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--green);
    padding: 5px 12px;
    font-size: 22px;
}

/* HERO */

.hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    padding-top: 100px;
    position: relative;
    overflow: hidden;
}

#matrixCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: .15;
    pointer-events: none;
}

.hero-grid {
    display: grid;
    grid-template-columns: 1.15fr .85fr;
    align-items: center;
    gap: 50px;
    position: relative;
    z-index: 2;
}

.hero-content {
    animation: revealLeft 1s ease both;
}

.terminal-label {
    font-family: 'Share Tech Mono', monospace;
    color: var(--green);
    font-size: 14px;
    letter-spacing: 2px;
    margin-bottom: 25px;
}

.terminal-label::before {
    content: "● ";
    color: var(--green);
    text-shadow: 0 0 10px var(--green);
}

.hero h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(34px, 5vw, 65px);
    line-height: 1.2;
    margin-bottom: 18px;
}

.hero h1 span {
    color: var(--green);
    text-shadow: 0 0 20px #00ff6640;
}

.typing-line {
    font-family: 'Share Tech Mono', monospace;
    color: var(--light);
    font-size: clamp(19px, 3vw, 28px);
    margin-bottom: 22px;
    min-height: 42px;
}

.typing-line .cursor {
    animation: blink .8s infinite;
    color: var(--green);
}

.hero-description {
    max-width: 570px;
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 32px;
}

.hero-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
}

.btn {
    padding: 13px 25px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 1px;
    border: 1px solid var(--green);
    background: var(--green);
    color: black;
    font-weight: bold;
    transition: .3s;
}

.btn:hover {
    background: transparent;
    color: var(--green);
    box-shadow: var(--glow);
    transform: translateY(-3px);
}

.btn-outline {
    background: transparent;
    color: var(--green);
}

.btn-outline:hover {
    background: var(--green);
    color: black;
}

.hero-stats {
    display: flex;
    gap: 30px;
    margin-top: 40px;
    flex-wrap: wrap;
}

.stat-item strong {
    display: block;
    font-family: 'Orbitron', sans-serif;
    color: var(--green);
    font-size: 22px;
}

.stat-item span {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--muted);
}

/* 3D PHOTO */

.hero-visual {
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1000px;
    animation: revealRight 1s ease both;
}

.photo-scene {
    position: relative;
    width: 330px;
    height: 430px;
    transform-style: preserve-3d;
    transition: transform .15s ease-out;
}

.photo-frame {
    position: absolute;
    inset: 10px;
    border: 1px solid var(--green);
    padding: 8px;
    background: #061009;
    transform: rotateY(-8deg) rotateX(4deg);
    box-shadow: 0 0 30px #00ff6615, inset 0 0 25px #00ff6610;
}

.photo-frame::before,
.photo-frame::after {
    content: "";
    position: absolute;
    width: 45px;
    height: 45px;
    border-color: var(--green);
    border-style: solid;
    z-index: 3;
}

.photo-frame::before {
    top: -5px;
    left: -5px;
    border-width: 2px 0 0 2px;
}

.photo-frame::after {
    bottom: -5px;
    right: -5px;
    border-width: 0 2px 2px 0;
}

.profile-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
    filter: contrast(1.05) saturate(.9);
}

/* If image filename is different, change profile.png above */

.photo-overlay {
    position: absolute;
    inset: 8px;
    pointer-events: none;
    background: linear-gradient(transparent 70%, rgba(0,255,102,.15));
    z-index: 2;
}

.scan-line {
    position: absolute;
    width: 100%;
    height: 3px;
    left: 0;
    top: 0;
    background: #00ff6680;
    box-shadow: 0 0 20px var(--green);
    z-index: 4;
    animation: scan 4s linear infinite;
}

.photo-status {
    position: absolute;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%);
    background: #061009;
    border: 1px solid var(--border);
    padding: 7px 15px;
    white-space: nowrap;
    font: 12px 'Share Tech Mono', monospace;
    color: var(--green);
}

.float-chip {
    position: absolute;
    padding: 9px 13px;
    font: 12px 'Share Tech Mono', monospace;
    color: var(--green);
    background: #07140b;
    border: 1px solid var(--border);
    box-shadow: var(--glow);
    animation: float 4s ease-in-out infinite;
}

.chip-one {
    top: 20px;
    right: -35px;
}

.chip-two {
    bottom: 40px;
    left: -40px;
    animation-delay: -2s;
}

/* ABOUT */

.about-grid {
    display: grid;
    grid-template-columns: 1.1fr .9fr;
    gap: 45px;
    align-items: center;
}

.about-text p {
    color: var(--muted);
    margin-bottom: 18px;
}

.about-terminal {
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--glow);
}

.terminal-top {
    display: flex;
    gap: 7px;
    padding: 12px 15px;
    border-bottom: 1px solid var(--border);
    align-items: center;
    font: 12px 'Share Tech Mono', monospace;
    color: var(--muted);
}

.terminal-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
}

.terminal-body {
    padding: 20px;
    font: 13px/2 'Share Tech Mono', monospace;
    color: var(--muted);
}

.terminal-body .green {
    color: var(--green);
}

.terminal-body .value {
    color: var(--light);
}

/* SKILLS */

.skills-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.skill-card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 25px;
    transition: .35s;
    position: relative;
    overflow: hidden;
}

.skill-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 1px;
    background: var(--green);
    transition: .5s;
}

.skill-card:hover::before {
    left: 0;
}

.skill-card:hover {
    transform: translateY(-8px) rotateX(3deg);
    border-color: var(--green);
    box-shadow: var(--glow);
}

.skill-icon {
    font-size: 26px;
    color: var(--green);
    margin-bottom: 15px;
}

.skill-card h3 {
    font-family: 'Orbitron', sans-serif;
    font-size: 15px;
    margin-bottom: 10px;
}

.skill-card p {
    color: var(--muted);
    font-size: 13px;
    min-height: 45px;
}

.skill-bar {
    height: 4px;
    background: #14251a;
    margin-top: 20px;
    overflow: hidden;
}

.skill-progress {
    width: 0;
    height: 100%;
    background: var(--green);
    box-shadow: 0 0 10px var(--green);
    transition: width 1.5s ease;
}

.skill-percent {
    font: 11px 'Share Tech Mono', monospace;
    color: var(--green);
    display: block;
    text-align: right;
    margin-top: 6px;
}

/* PROJECTS */

.projects-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
}

.project-card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 30px;
    transition: .35s;
    transform-style: preserve-3d;
}

.project-card:hover {
    transform: translateY(-8px) rotateX(2deg) rotateY(-2deg);
    border-color: var(--green);
    box-shadow: var(--glow);
}

.project-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.project-icon {
    font-size: 30px;
    color: var(--green);
}

.project-number {
    font: 12px 'Share Tech Mono', monospace;
    color: var(--muted);
}

.project-card h3 {
    font-family: 'Orbitron', sans-serif;
    font-size: 17px;
    margin-bottom: 12px;
}

.project-card p {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 22px;
}

.tag {
    border: 1px solid var(--border);
    padding: 4px 10px;
    color: var(--green);
    font: 11px 'Share Tech Mono', monospace;
}

.project-link {
    color: var(--green);
    font: 13px 'Share Tech Mono', monospace;
    border-bottom: 1px solid var(--green);
    padding-bottom: 4px;
}

/* EXPERIENCE / CERTIFICATIONS */

.timeline {
    max-width: 750px;
}

.timeline-item {
    position: relative;
    border-left: 1px solid var(--green);
    padding: 0 0 35px 30px;
    margin-left: 8px;
}

.timeline-item::before {
    content: "";
    position: absolute;
    left: -5px;
    top: 6px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 12px var(--green);
}

.timeline-date {
    color: var(--green);
    font: 12px 'Share Tech Mono', monospace;
    margin-bottom: 8px;
}

.timeline-item h3 {
    font-family: 'Orbitron', sans-serif;
    font-size: 17px;
    margin-bottom: 8px;
}

.timeline-item p {
    color: var(--muted);
    font-size: 14px;
}

/* MANAGEMENT PANEL */

.manage-panel {
    border: 1px solid var(--border);
    background: var(--card);
    padding: 25px;
    margin-top: 35px;
}

.manage-panel h3 {
    font: 16px 'Orbitron', sans-serif;
    color: var(--green);
    margin-bottom: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.form-control {
    width: 100%;
    background: #020805;
    color: var(--text);
    border: 1px solid #1a3825;
    padding: 12px;
    margin-bottom: 12px;
    outline: none;
    font: 13px 'Share Tech Mono', monospace;
}

.form-control:focus {
    border-color: var(--green);
    box-shadow: var(--glow);
}

.form-control::placeholder {
    color: #52735b;
}

.form-grid .full {
    grid-column: 1/-1;
}

.manage-btn {
    background: var(--green);
    border: none;
    padding: 10px 18px;
    font: bold 13px 'Share Tech Mono', monospace;
    color: black;
}

.manage-btn:hover {
    background: var(--light);
}

.delete-btn {
    border: 1px solid #ff5555;
    color: #ff5555;
    background: transparent;
    padding: 4px 9px;
    margin-left: 10px;
    font: 11px 'Share Tech Mono', monospace;
}

.delete-btn:hover {
    background: #ff5555;
    color: black;
}

.manage-note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 15px;
}

/* CONTACT */

.contact-box {
    border: 1px solid var(--border);
    background: var(--card);
    padding: 40px;
    box-shadow: var(--glow);
}

.contact-box p {
    color: var(--muted);
    margin-bottom: 25px;
}

.contact-links {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
}

/* VOICE ASSISTANT */

.voice-btn {
    position: fixed;
    bottom: 25px;
    right: 25px;
    z-index: 2000;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: #031009;
    border: 1px solid var(--green);
    color: var(--green);
    font-size: 25px;
    box-shadow: 0 0 20px #00ff6630;
    transition: .3s;
    animation: micGlow 2.5s infinite;
}

.voice-btn:hover {
    transform: scale(1.1);
    background: var(--green);
    color: black;
}

.voice-btn.active {
    background: var(--green);
    color: black;
    animation: micPulse .6s infinite alternate;
}

.voice-status {
    position: fixed;
    right: 25px;
    bottom: 100px;
    z-index: 2000;
    max-width: 280px;
    background: #07140b;
    border: 1px solid var(--green);
    box-shadow: var(--glow);
    color: var(--green);
    font: 12px 'Share Tech Mono', monospace;
    padding: 13px 18px;
    display: none;
}

/* CHATBOT */

.chat-toggle {
    position: fixed;
    bottom: 25px;
    left: 25px;
    z-index: 2000;
    border: 1px solid var(--green);
    background: #061009;
    color: var(--green);
    padding: 14px 18px;
    font: 13px 'Share Tech Mono', monospace;
    box-shadow: var(--glow);
}

.chat-box {
    position: fixed;
    bottom: 85px;
    left: 25px;
    z-index: 2000;
    width: min(360px, calc(100vw - 35px));
    height: 430px;
    background: #030a05;
    border: 1px solid var(--green);
    box-shadow: 0 0 30px #00ff6620;
    display: none;
    flex-direction: column;
}

.chat-header {
    padding: 14px;
    border-bottom: 1px solid var(--border);
    font: 13px 'Share Tech Mono', monospace;
    color: var(--green);
    display: flex;
    justify-content: space-between;
}

.chat-messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    font: 13px/1.6 'Share Tech Mono', monospace;
}

.message {
    margin-bottom: 12px;
    overflow-wrap: anywhere;
}

.bot-message {
    color: var(--green);
}

.user-message {
    color: var(--light);
    text-align: right;
}

.chat-input-area {
    display: flex;
    border-top: 1px solid var(--border);
}

.chat-input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--green);
    padding: 13px;
    font: 13px 'Share Tech Mono', monospace;
}

.chat-send {
    border: none;
    background: var(--green);
    color: black;
    padding: 0 15px;
    font-weight: bold;
}

/* FOOTER */

footer {
    border-top: 1px solid var(--border);
    padding: 25px 0;
    text-align: center;
    font: 12px 'Share Tech Mono', monospace;
    color: var(--muted);
}

footer span {
    color: var(--green);
}

/* ANIMATIONS */

@keyframes blink {
    50% { opacity: 0; }
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

@keyframes scan {
    0% { top: 0; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { top: 100%; opacity: 0; }
}

@keyframes micGlow {
    0%, 100% { box-shadow: 0 0 0 0 #00ff6620; }
    50% { box-shadow: 0 0 0 12px #00ff6600, 0 0 25px #00ff6650; }
}

@keyframes micPulse {
    from { transform: scale(1); }
    to { transform: scale(1.12); }
}

@keyframes revealLeft {
    from { opacity: 0; transform: translateX(-40px); }
    to { opacity: 1; transform: translateX(0); }
}

@keyframes revealRight {
    from { opacity: 0; transform: translateX(40px); }
    to { opacity: 1; transform: translateX(0); }
}

.reveal {
    opacity: 0;
    transform: translateY(35px);
    transition: .8s ease;
}

.reveal.visible {
    opacity: 1;
    transform: translateY(0);
}

/* RESPONSIVE */

@media(max-width: 850px) {
    .nav-links {
        gap: 14px;
    }

    .nav-links a {
        font-size: 11px;
    }

    .hero-grid {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 55px;
        padding-top: 40px;
        padding-bottom: 60px;
    }

    .hero-content {
        order: 2;
    }

    .hero-visual {
        order: 1;
    }

    .hero-description {
        margin-left: auto;
        margin-right: auto;
    }

    .hero-buttons {
        justify-content: center;
    }

    .hero-stats {
        justify-content: center;
    }

    .about-grid {
        grid-template-columns: 1fr;
    }

    .skills-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 650px) {
    .navbar {
        min-height: 65px;
    }

    .menu-toggle {
        display: block;
    }

    .nav-links {
        display: none;
        position: absolute;
        top: 65px;
        left: 0;
        width: 100%;
        padding: 15px 5%;
        background: #030a05;
        border-bottom: 1px solid var(--border);
        flex-direction: column;
        gap: 0;
    }

    .nav-links.open {
        display: flex;
    }

    .nav-links li a {
        display: block;
        padding: 12px 0;
        border-bottom: 1px solid #102017;
        font-size: 14px;
    }

    section {
        padding: 75px 0;
    }

    .photo-scene {
        width: 260px;
        height: 340px;
    }

    .chip-one {
        right: -15px;
    }

    .chip-two {
        left: -15px;
    }

    .projects-grid {
        grid-template-columns: 1fr;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-grid .full {
        grid-column: auto;
    }

    .contact-box {
        padding: 25px;
    }

    .voice-btn {
        width: 52px;
        height: 52px;
        right: 15px;
        bottom: 15px;
    }

    .chat-toggle {
        left: 15px;
        bottom: 15px;
        padding: 12px;
    }

    .chat-box {
        left: 15px;
        bottom: 75px;
        height: 400px;
    }

    .voice-status {
        right: 15px;
        bottom: 80px;
    }
}
