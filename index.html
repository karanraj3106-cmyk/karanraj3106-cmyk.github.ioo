
<script>
/* ==================================
   KARAN RAJ - VOICE ASSISTANT
   Indian English Male Voice
================================== */

const synth = window.speechSynthesis;
let selectedVoice = null;

// Find Indian English voice
function loadIndianVoice() {
    const voices = synth.getVoices();

    selectedVoice =
        voices.find(v =>
            v.lang === "en-IN" &&
            /male|man|ravi/i.test(v.name)
        ) ||
        voices.find(v => v.lang === "en-IN") ||
        voices.find(v => v.lang.startsWith("en-IN")) ||
        voices.find(v => v.lang.startsWith("en-GB")) ||
        voices.find(v => v.lang.startsWith("en-US"));

    console.log("Selected voice:", selectedVoice?.name);
}

loadIndianVoice();
synth.onvoiceschanged = loadIndianVoice;


// Speak text
function speak(text) {
    if (!text) return;

    synth.cancel();

    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = selectedVoice?.lang || "en-IN";
    speech.voice = selectedVoice;
    speech.rate = 0.90;
    speech.pitch = 0.85;
    speech.volume = 1;

    synth.speak(speech);
}


// Stop speaking
function stopSpeaking() {
    synth.cancel();
}


// Hear portfolio introduction
const hearIntro = document.getElementById("hearIntro");

if (hearIntro) {
    hearIntro.addEventListener("click", () => {
        speak(
            "Hello! I am Karan Raj. " +
            "I am a Bachelor of Computer Applications student " +
            "at RKDF University, Ranchi. " +
            "My interests include Cybersecurity, Ethical Hacking, " +
            "and Generative Artificial Intelligence. " +
            "I am passionate about learning new technologies, " +
            "building projects, and developing my technical skills. " +
            "Thank you for visiting my portfolio."
        );
    });
}


// Voice assistant elements
const assistant = document.querySelector(".assistant");
const assistantFab = document.querySelector(".assistant-fab");
const closeAssistant = document.querySelector(".close");
const chatlog = document.querySelector(".chatlog");
const chatForm = document.querySelector(".chat-form");
const chatInput = document.querySelector(".chat-form input");
const assistantStatus = document.querySelector(".assistant-status");


// Open assistant
if (assistantFab && assistant) {
    assistantFab.addEventListener("click", () => {
        assistant.classList.add("open");

        if (assistantStatus) {
            assistantStatus.textContent =
                "ONLINE • INDIAN ENGLISH VOICE";
        }
    });
}


// Close assistant
if (closeAssistant && assistant) {
    closeAssistant.addEventListener("click", () => {
        assistant.classList.remove("open");
        stopSpeaking();
    });
}


// Add chat message
function addMessage(text, type) {
    if (!chatlog) return;

    const bubble = document.createElement("div");
    bubble.className = "bubble " + type;
    bubble.textContent = text;

    chatlog.appendChild(bubble);
    chatlog.scrollTop = chatlog.scrollHeight;
}


// Assistant response
function getResponse(message) {
    const msg = message.toLowerCase();

    if (msg.includes("hello") || msg.includes("hi") ||
        msg.includes("hey")) {
        return "Hello! Welcome to Karan Raj's portfolio. How can I help you?";
    }

    if (msg.includes("your name") || msg.includes("who are you")) {
        return "I am Karan Raj's portfolio voice assistant.";
    }

    if (msg.includes("karan")) {
        return "Karan Raj is a BCA student at RKDF University, Ranchi.";
    }

    if (msg.includes("education") || msg.includes("college")) {
        return "Karan is pursuing Bachelor of Computer Applications at RKDF University in Ranchi.";
    }

    if (msg.includes("skill") || msg.includes("programming")) {
        return "Karan is learning C, C++, Java, HTML, CSS, Cybersecurity, and Generative AI.";
    }

    if (msg.includes("cybersecurity") || msg.includes("hacking")) {
        return "Karan is interested in Cybersecurity and Ethical Hacking, with a focus on responsible and authorized learning.";
    }

    if (msg.includes("ai") || msg.includes("artificial intelligence")) {
        return "Karan is exploring Generative AI and its practical applications.";
    }

    if (msg.includes("project") || msg.includes("portfolio")) {
        return "This portfolio is one of Karan's web development projects. He is also exploring AI and cybersecurity projects.";
    }

    if (msg.includes("contact") || msg.includes("email")) {
        return "You can contact Karan through the contact details available in the Contact section of this portfolio.";
    }

    if (msg.includes("thank")) {
        return "You're welcome! Thank you for visiting the portfolio.";
    }

    if (msg.includes("bye") || msg.includes("goodbye")) {
        return "Goodbye! Have a wonderful day.";
    }

    return "Sorry, I am still learning. You can ask me about Karan, his education, skills, projects, or interests.";
}


// Chat form
if (chatForm) {
    chatForm.addEventListener("submit", function(event) {
        event.preventDefault();

        if (!chatInput) return;

        const message = chatInput.value.trim();
        if (!message) return;

        addMessage(message, "user");
        chatInput.value = "";

        const response = getResponse(message);

        setTimeout(() => {
            addMessage(response, "");
            speak(response);
        }, 400);
    });
}


// Quick reply buttons
document.querySelectorAll(".quick button").forEach(button => {
    button.addEventListener("click", () => {
        const message = button.textContent.trim();

        if (!message) return;

        addMessage(message, "user");

        const response = getResponse(message);

        setTimeout(() => {
            addMessage(response, "");
            speak(response);
        }, 300);
    });
});


// Stop voice when page is hidden
document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        stopSpeaking();
    }
});

</script>
